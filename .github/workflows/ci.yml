name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve VS install path (vswhere)
        shell: pwsh
        run: |
          $installPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not $installPath) { throw 'vswhere found no Visual Studio installation.' }
          "VSINSTALLDIR=$installPath\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: dotnet build VsDebugMcp.slnx

      - name: Test
        run: dotnet test VsDebugMcp.slnx --no-build

      - name: Publish hygiene (stale-dir poison guard)
        shell: pwsh
        run: |
          # dotnet publish never cleans the output dir: a stale 74 KB
          # System.Management placeholder (NuGet lib/net10.0 asset, throws
          # PlatformNotSupportedException, breaks list_processes/attach_process)
          # once shadowed a good publish (see TROUBLESHOOTING stale-dir entry).
          # Publish to an empty dir and trip if the placeholder is on top.
          # Probe below exits 2 by design (usage line); Start-Process + file
          # redirects keep a native non-zero exit and its stderr from
          # aborting the step, so check ExitCode manually.
          $out = Join-Path $env:RUNNER_TEMP 'publish-check'
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          dotnet publish src/VsDebugMcp/VsDebugMcp.csproj -c Release -r win-x64 --self-contained -o $out
          $dll = Join-Path $out 'System.Management.dll'
          $len = (Get-Item $dll).Length
          if ($len -lt 100KB) { throw "publish poisoned: $dll is $len bytes (placeholder stub, want the ~314 KB Windows impl)" }
          $p = Start-Process -FilePath (Join-Path $out 'VsDebugMcp.exe') -ArgumentList '--live-check' -NoNewWindow -Wait -PassThru -RedirectStandardOutput (Join-Path $out 'probe-out.txt') -RedirectStandardError (Join-Path $out 'probe-err.txt')
          Get-Content (Join-Path $out 'probe-out.txt'), (Join-Path $out 'probe-err.txt')
          if ($p.ExitCode -ne 2) { throw "smoke probe failed: exit $($p.ExitCode), want 2 (usage line)" }
