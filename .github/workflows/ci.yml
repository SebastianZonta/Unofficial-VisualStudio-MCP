name: ci

on:
  push:
  pull_request:

jobs:
  install-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer syntax
        run: |
          bash -n install.sh
          python3 -c "import re,sys;src=open('install.ps1',encoding='utf-8-sig').read();sys.exit(0 if re.search(r'param\s*\(',src) else 1)"

      - name: Installer/doc drift guard
        run: |
          # INSTALL.md must document every user-facing flag the installers accept,
          # and the opencode config shape they write, or a subagent mistypes it.
          for flag in --dest --exe --config-only -Dest -Exe -ConfigOnly mcp.servers; do
            grep -qF -- "$flag" INSTALL.md || { echo "INSTALL.md missing '$flag'"; exit 1; }
          done
          grep -qF "mcpServers" install.sh || { echo "install.sh missing mcpServers"; exit 1; }
          grep -qF "mcpServers" install.ps1 || { echo "install.ps1 missing mcpServers"; exit 1; }

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve VS install path (vswhere)
        shell: pwsh
        run: |
          $installPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not $installPath) { throw 'vswhere found no Visual Studio installation.' }
          "VSINSTALLDIR=$installPath\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: dotnet build VsDebugMcp.slnx

      - name: Test
        run: dotnet test VsDebugMcp.slnx --no-build

      - name: CRAP gate (changed methods only)
        shell: pwsh
        run: |
          # Scoped to changed methods: repo-wide 8.0 is unpassable (live-VS
          # code scores Cov 0% without coverage). Full-coverage gate only
          # after a trial `dotnet test --collect:"XPlat Code Coverage"` proves fast/green.
          dotnet tool restore
          dotnet tool run crap4csharp --diff origin/main --no-coverage --no-progress --threshold 8.0 --format text

      - name: Bridge-behavior gate (fake/live parity)
        shell: pwsh
        run: |
          # CODING_STANDARDS.md pre-audit gate as code: a bridge or shared-gate
          # diff must ship with an AuditE2ETests case. No VS needed.
          $bridge = @('src/VsDebugMcp/DteDebugBridge.cs', 'src/VsDebugMcp/FakeDebugBridge.cs', 'src/VsDebugMcp/BreakpointOptions.cs', 'src/VsDebugMcp/ArgumentValidator.cs', 'src/VsDebugMcp/VariableWrite.cs', 'src/VsDebugMcp/ComErrorMapper.cs')
          $base = (git merge-base HEAD origin/main 2>$null); if (-not $base) { $base = 'HEAD~1' }
          $diff = @(git diff --name-only $base HEAD)
          $touched = $bridge | Where-Object { $diff -contains $_ }
          $auditTouched = $diff -contains 'tests/VsDebugMcp.E2E/AuditE2ETests.cs'
          if ($touched -and -not $auditTouched) { throw "bridge diff ($($touched -join ', ')) needs an AuditE2ETests.cs case (CODING_STANDARDS.md pre-audit gate)" }

      - name: Publish hygiene (stale-dir poison guard)
        shell: pwsh
        run: |
          # dotnet publish never cleans the output dir: a stale 74 KB
          # System.Management placeholder (NuGet lib/net10.0 asset, throws
          # PlatformNotSupportedException, breaks list_processes/attach_process)
          # once shadowed a good publish (see TROUBLESHOOTING stale-dir entry).
          # Publish to an empty dir and trip if the placeholder is on top.
          # Probe below exits 2 by design (usage line); Start-Process + file
          # redirects keep a native non-zero exit and its stderr from
          # aborting the step, so check ExitCode manually.
          $out = Join-Path $env:RUNNER_TEMP 'publish-check'
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          dotnet publish src/VsDebugMcp/VsDebugMcp.csproj -c Release -r win-x64 --self-contained -o $out
          $dll = Join-Path $out 'System.Management.dll'
          $len = (Get-Item $dll).Length
          if ($len -lt 100KB) { throw "publish poisoned: $dll is $len bytes (placeholder stub, want the ~314 KB Windows impl)" }
          $p = Start-Process -FilePath (Join-Path $out 'VsDebugMcp.exe') -ArgumentList '--live-check' -NoNewWindow -Wait -PassThru -RedirectStandardOutput (Join-Path $out 'probe-out.txt') -RedirectStandardError (Join-Path $out 'probe-err.txt')
          Get-Content (Join-Path $out 'probe-out.txt'), (Join-Path $out 'probe-err.txt')
          if ($p.ExitCode -ne 2) { throw "smoke probe failed: exit $($p.ExitCode), want 2 (usage line)" }
